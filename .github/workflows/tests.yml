name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install x86 and boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib qemu-system-x86 grub-pc-bin grub-common xorriso mtools
      - run: make test

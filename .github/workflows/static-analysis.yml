name: Static analysis

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push and pull_request events for the same feature branch should share one
# fast lane instead of doing identical work twice. Include the head repository
# so same-named branches from different forks remain independent.
concurrency:
  group: static-analysis-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7

      - name: Install host analysis toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib cppcheck

      - name: Run static-analysis gates
        run: make static-analysis
